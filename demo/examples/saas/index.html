<style>
:root{--bg:#f7fbfd;--bg2:#e8f5fa;--card:#fff;--ink:#0a1a33;--mute:#4a5f7a;--line:rgba(10,40,80,.14);--brand:#0891b2;--brand2:#fde047;--brand-ink:#fff;--glow:rgba(6,182,212,.22);--r:20px;
--lv-accent:#06b6d4;--lv-line:rgba(10,40,80,.14);--lv-surface:#fff;--lv-card:#fff;--lv-bg:#f7fbfd;--lv-fg:#0a1a33;--lv-ring:#22d3ee;
--display:'Space Grotesk',system-ui,sans-serif;--body:'DM Sans',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#050d1f;--bg2:#0a1830;--card:#0c1c38;--ink:#eaf6ff;--mute:#93abc8;--line:rgba(34,211,238,.18);--brand:#22d3ee;--brand2:#fde047;--brand-ink:#04121f;--glow:rgba(34,211,238,.25);
--lv-accent:#22d3ee;--lv-line:rgba(34,211,238,.18);--lv-surface:#0c1c38;--lv-card:#0c1c38;--lv-bg:#050d1f;--lv-fg:#eaf6ff;--lv-ring:#22d3ee}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;background-attachment:fixed;margin:0;background-color:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--display);line-height:1.05;letter-spacing:-.03em;margin:0}
a{color:inherit}button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand2);outline-offset:3px;border-radius:8px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
section{padding:88px 0;position:relative}
.eyebrow{display:inline-block;font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin-bottom:14px}
.h2{font-size:clamp(32px,5vw,52px);font-weight:800;max-width:15em}
.lede{color:var(--mute);font-size:18px;max-width:34em;margin:16px 0 0}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;text-decoration:none;font-weight:600;padding:13px 22px;border-radius:99px;background:var(--brand);color:var(--brand-ink);transition:transform .2s,box-shadow .2s;box-shadow:0 8px 24px var(--glow)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px var(--glow)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
/* nav */
.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:24px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font:800 22px var(--display);letter-spacing:-.03em;text-decoration:none}
.logo i{width:26px;height:26px;border-radius:50%;border:3px solid var(--brand);position:relative}
.logo i:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--brand2);top:-6px;right:-2px}
.nav ul{display:flex;gap:6px;list-style:none;margin:0 auto 0 12px;padding:0}
.nav ul a{padding:8px 12px;border-radius:99px;text-decoration:none;color:var(--mute);font-weight:500;font-size:15px}
.nav ul a:hover{color:var(--ink);background:var(--bg2)}
.nav .btn{padding:9px 18px;font-size:14px}.nav .signin{font-size:14px;font-weight:500;text-decoration:none;color:var(--mute)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;margin-left:auto}
@media(max-width:820px){.nav ul,.nav .signin{display:none}.burger{display:block}.nav .btn{display:none}
.nav.open ul{display:flex;flex-direction:column;position:absolute;top:64px;left:0;right:0;background:var(--bg);padding:12px 20px 20px;border-bottom:1px solid var(--line);margin:0}.nav.open ul a{display:block}}
/* hero */
.hero{padding:56px 0 40px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-20% -10% auto;height:620px;background:radial-gradient(40% 50% at 70% 30%,var(--glow),transparent 70%),radial-gradient(30% 40% at 20% 20%,rgba(253,224,71,.12),transparent 70%);z-index:-1}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:32px;align-items:center}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--card);padding:5px 14px 5px 6px;border-radius:99px;font-size:14px;margin-bottom:22px}
.pill b{background:var(--brand2);color:#0a1a33;border-radius:99px;padding:1px 9px;font-size:12px}
.hero h1{font-size:clamp(42px,7vw,84px);font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0 26px}
.proof{display:flex;align-items:center;gap:14px;color:var(--mute);font-size:14px}
.scene{display:grid;place-items:center;min-height:380px}
.scene>div{max-width:100%}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}.scene{min-height:300px;overflow:hidden}.scene>div{transform:scale(.8)}}
/* marquee */
.logos{padding:28px 0;border-block:1px solid var(--line);background:var(--bg2)}
.logos p{text-align:center;margin:0 0 16px;color:var(--mute);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin-top:48px;text-align:center}
.stats b{display:block;font:800 clamp(34px,5vw,52px) var(--display);letter-spacing:-.03em;color:var(--brand)}
.stats span{color:var(--mute);font-size:14px}
/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-top:44px}
.tile{grid-column:span 2;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;gap:12px;overflow:hidden;position:relative;transition:transform .25s,box-shadow .25s}
.tile:hover{transform:translateY(-4px);box-shadow:0 18px 40px var(--glow)}
.tile.w3{grid-column:span 3}.tile.w4{grid-column:span 4}
.tile h3{font-size:22px;font-weight:700;letter-spacing:-.02em}.tile p{margin:0;color:var(--mute);font-size:15px}
.tile .vis{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tile .bubble{background:var(--bg2);border-radius:14px 14px 14px 4px;padding:8px 12px;font-size:13px}
@media(max-width:900px){.tile,.tile.w3,.tile.w4{grid-column:span 6}}
@media(min-width:601px) and (max-width:900px){.tile{grid-column:span 3}.tile.w4{grid-column:span 6}}
/* how */
.how{background:var(--bg2)}
.how .wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start}
.how .sticky{position:sticky;top:110px}
.how ol p{margin:4px 0 0;color:var(--mute)}.how ol h3{font-size:22px;font-weight:700}
@media(max-width:820px){.how .wrap{grid-template-columns:1fr;gap:30px}.how .sticky{position:static}}
/* demo */
.demo-shell{margin-top:40px;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 30px 80px var(--glow)}
.demo-bar{display:flex;gap:7px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg2);align-items:center}
.demo-bar i{width:11px;height:11px;border-radius:50%;background:var(--line)}.demo-bar span{margin-left:10px;font-size:12px;color:var(--mute)}
.demo-body{padding:22px;min-height:340px}
.ui-row{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--line);margin-bottom:10px;background:var(--bg)}
.ui-row p{margin:2px 0 0;font-size:14px;color:var(--mute)}.ui-row b{font-size:14px}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--glow);color:var(--brand);margin-left:6px;font-weight:600}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px;margin-top:16px}
.bars div{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(var(--brand),var(--brand2));transform-origin:bottom;animation:grow .7s both}
@keyframes grow{from{transform:scaleY(0)}}
.demo-body textarea,.demo-body input[type=text]{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
/* pricing */
.price-head{display:flex;align-items:center;gap:14px;margin:30px 0 34px;flex-wrap:wrap}
.save{background:var(--brand2);color:#0a1a33;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:12px;position:relative}
.plan.pop{border-color:transparent;box-shadow:0 24px 60px var(--glow)}
.plan .amt{font:800 46px var(--display);letter-spacing:-.04em}.plan .amt small{font:500 15px var(--body);color:var(--mute);letter-spacing:0}
.plan ul{list-style:none;margin:6px 0 10px;padding:0;display:grid;align-content:start;gap:8px;font-size:15px;flex:1}
.plan li:before{content:"✓";color:var(--brand);font-weight:800;margin-right:8px}
.plan .btn{justify-content:center}
.plan h3{font-size:22px}
.tag{position:absolute;top:-12px;left:28px;background:var(--brand2);color:#0a1a33;font-size:12px;font-weight:700;padding:3px 12px;border-radius:99px;z-index:2}
/* testimonials */
.tm{background:var(--bg2)}
.car{position:relative;margin-top:36px}
.car .slide{max-width:760px;margin:0 auto;animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.car-ctl{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:20px}
.car-ctl button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
.dots{display:flex;gap:8px}.dots button{width:10px;height:10px;padding:0;border-radius:50%;background:var(--line)}.dots button[aria-current=true]{background:var(--brand);width:26px;border-radius:6px}
/* faq */
.faq-wrap{max-width:780px;margin:36px auto 0}
/* final */
.final{text-align:center;padding:96px 0}
.final .box{background:linear-gradient(135deg,#031a3a,#0b4f78 60%,#06b6d4);border-radius:32px;padding:64px 24px;color:#fff;position:relative;overflow:hidden}
.final h2{font-size:clamp(34px,6vw,64px);font-weight:800;max-width:12em;margin:0 auto}
.final p{opacity:.9;max-width:30em;margin:16px auto 28px}
.nl{max-width:480px;margin:0 auto;color:var(--ink);text-align:left;background:var(--card);border-radius:99px;padding:4px}
.beam{position:relative;border-radius:var(--r);padding:2px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--brand2) 85%,var(--brand) 100%);animation:spin 5s linear infinite}
.beam>.in{background:var(--card);border-radius:calc(var(--r) - 2px);height:100%}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.plan.pop{border:0;border-radius:22px;height:100%}
.ex-back{position:fixed;left:14px;bottom:14px;z-index:100;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font:600 13px var(--body);text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:.85}
.ex-back:hover{opacity:1}
.toast{position:fixed;right:16px;bottom:16px;z-index:100;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fade .3s}
footer{padding-top:30px}

/* mobile pass */
html{-webkit-text-size-adjust:100%}
a,button,summary,[role=tab],[role=switch]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media (pointer:coarse),(max-width:820px){
 button,[role=tab],[role=switch],summary,.nav ul a,.btn,.signin,.ex-back{min-height:44px;min-width:44px}
 .nav ul a{display:flex;align-items:center}
 input,textarea,select{font-size:16px!important;min-height:44px!important}
 footer a{min-width:44px;justify-content:center;padding-inline:6px}
 #root button,#root summary{min-height:44px!important}
 #root [role=switch]{padding-block:6px!important}
 [role=switch]{position:relative}[role=switch]:after{content:"";position:absolute;inset:-8px -4px}
 summary{min-height:48px;padding-block:8px}
 .logo,.footer a,footer a{min-height:44px;display:inline-flex;align-items:center}
 .dots{gap:4px}.dots button{width:24px;height:44px;background:none;position:relative}.dots button:before{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--line)}.dots button[aria-current=true]:before{background:var(--brand);width:26px;margin-left:-13px;border-radius:6px}
}
.nav{padding-top:env(safe-area-inset-top)}
.nav .wrap{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
.ex-back{left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:inline-flex;align-items:center}
.toast{right:max(16px,env(safe-area-inset-right));bottom:max(64px,calc(env(safe-area-inset-bottom) + 56px))}
body.lock{overflow:hidden;overscroll-behavior:contain}
.nav.open ul{overscroll-behavior:contain;max-height:calc(100dvh - 64px);overflow:auto}
.burger{min-width:44px;min-height:44px}
.tile:focus-within{transform:translateY(-4px);box-shadow:0 18px 40px var(--glow)}
.tile{touch-action:manipulation}
.marquee-clip,.logos,.scene,.hero{overflow:hidden;max-width:100%}
@supports (overflow:clip){body{overflow-x:clip}}
section:not(.hero){content-visibility:auto;contain-intrinsic-size:auto 700px}
.paused *{animation-play-state:paused!important}
@media(max-width:600px){
 .hero{padding-top:32px}.hero h1{font-size:clamp(36px,12vw,56px)}
 .h2{font-size:clamp(28px,8.5vw,40px)}section{padding:56px 0}
 .nav,.demo-shell,.tile:hover{backdrop-filter:none;box-shadow:none}
 .hero:before{filter:none;opacity:.7}.final .box{padding:44px 16px}
 .plans{grid-template-columns:1fr}.cta-row .btn{flex:1;justify-content:center}
 .scene{min-height:260px}.scene>div{transform:scale(.62)}
}
@media(max-height:480px) and (orientation:landscape){.hero{padding:20px 0}.hero h1{font-size:clamp(30px,6vw,44px)}section{padding:48px 0}}
@media(max-width:340px){.wrap{padding:0 14px}.logo{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<body>

<script type="module">
import { createElement as h, useState, useEffect, useMemo, useRef, Fragment } from 'react'
import { createRoot } from 'react-dom/client'
import * as C from '../../../dist/components.js'
import { Livatar } from '../../../dist/react.js'
import { buddy, animal, bot, tech, office, money, human, ai } from '../../../dist/index.js'

const PAL = ['#cffafe','#fef9c3','#e0f2fe','#ccfbf1','#ffffff']
const AV = { colors: PAL, variant: buddy }
const L = (p) => h(Livatar, { colors: PAL, ...p })
const TEAM = ['mira','jonas','priya','kenji','amara','leo','sofia','omar','nina','tariq','ines','dev']
const NAMES = ['Northwind','Lumen','Fieldstone','Kite','Halcyon','Parcel','Moonrise','Tidal','Ferro','Plume']

function Nav() {
  const [open, setOpen] = useState(false)
  useEffect(() => { document.body.classList.toggle('lock', open); if (!open) return; const k = (e) => e.key === 'Escape' && setOpen(false); addEventListener('keydown', k); return () => { removeEventListener('keydown', k); document.body.classList.remove('lock') } }, [open])
  const links = [['Features','#features'],['How it works','#how'],['Demo','#demo'],['Pricing','#pricing'],['FAQ','#faq']]
  return h('header', { className: 'nav' + (open ? ' open' : '') },
    h('div', { className: 'wrap' },
      h('a', { className: 'logo', href: '#top' }, h('i'), 'Orbit'),
      h('nav', { 'aria-label': 'Primary' }, h('ul', { id: 'menu' }, links.map(([l, href]) => h('li', { key: l }, h('a', { href, onClick: () => setOpen(false) }, l))))),
      h('a', { className: 'signin', href: '#final' }, 'Sign in'),
      h('a', { className: 'btn', href: '#final' }, 'Start free'),
      h('button', { className: 'burger', 'aria-label': 'Toggle menu', 'aria-expanded': open, 'aria-controls': 'menu', onClick: () => setOpen(!open) }, open ? '✕' : '☰')))
}

function usePause(ref) {
  useEffect(() => { const el = ref.current; if (!el || !('IntersectionObserver' in window)) return; const io = new IntersectionObserver(([e]) => el.classList.toggle('paused', !e.isIntersecting)); io.observe(el); return () => io.disconnect() }, [])
}
function Hero() {
  const sc = useRef(null); usePause(sc)
  const small = matchMedia('(max-width:600px)').matches

  return h('section', { className: 'hero', id: 'top' }, h('div', { className: 'wrap' },
    h('div', null,
      h('div', { className: 'pill' }, h('b', null, 'New'), 'Pulse AI summaries are here'),
      h('h1', null, 'Standups without the ', h('em', null, 'stand'), '.'),
      h('p', { className: 'lede' }, 'Orbit gives distributed teams a daily pulse everyone actually reads. Two minutes to write, thirty seconds to catch up, zero meetings.'),
      h('div', { className: 'cta-row' }, h('a', { className: 'btn', href: '#final' }, 'Start free for 14 days →'), h('a', { className: 'btn ghost', href: '#demo' }, 'See it in action')),
      h('div', { className: 'proof' }, h(C.LivatarStack, { avatar: AV, users: TEAM.slice(0, 6).map((id, i) => ({ id, name: id, status: i % 3 ? 'online' : 'away' })), max: 5, size: 38 }), h('span', null, 'Loved by ', h('b', null, '12,400+'), ' teammates'))),
    h('div', { className: 'scene', ref: sc, 'aria-hidden': 'true' },
      h(C.LivatarOrbit, { center: { variant: buddy, seed: 'orbit-core', mood: 'happy', colors: PAL }, avatar: AV, people: TEAM.slice(0, small ? 5 : 8).map((id) => ({ id })), radius: 130, size: 46, rings: small ? 1 : 2, duration: 40 }))))
}

function Logos() {
  return h('div', { className: 'logos' }, h('p', null, 'Trusted by remote-first teams in 60+ countries'),
    h(C.LivatarMarquee, { avatar: AV, users: [...TEAM, ...NAMES], size: 52, duration: 40 }))
}

function Features() {
  const tile = (cls, title, body, vis) => h(C.LivatarSpotlightCard, { key: title }, null)
  return h('section', { id: 'features' }, h('div', { className: 'wrap' },
    h('span', { className: 'eyebrow' }, 'Features'), h('h2', { className: 'h2' }, 'Everything your team needs to stay in sync'),
    h('p', { className: 'lede' }, 'Orbit replaces the 9:30 call with a calm, searchable timeline of what everyone is doing.'),
    h('div', { className: 'bento' },
      h('article', { className: 'tile w4' }, h('h3', null, 'Async pulse in two minutes'), h('p', null, 'Answer three tiny prompts. Orbit reminds teammates in their own timezone, never at 3am.'),
        h('div', { className: 'vis' }, ['mira','jonas','priya'].map((n, i) => h(Fragment, { key: n }, h(L, { variant: buddy, seed: n, size: 40, mood: 'happy' }), h('span', { className: 'bubble' }, ['Shipped billing v2', 'Pairing on auth bug', 'Reviewing designs'][i]))))),
      h('article', { className: 'tile' }, h('h3', null, 'Pulse AI'), h('p', null, 'A one-paragraph digest of the whole team, every morning.'),
        h('div', { className: 'vis' }, h(L, { variant: bot, seed: 'pulse-ai', size: 64, mood: 'thinking' }), h(C.LivatarTyping, { colors: PAL, variant: buddy }))),
      h('article', { className: 'tile w3' }, h('h3', null, 'Presence that feels human'), h('p', null, 'See who is deep in focus, who is around, and who just signed off.'),
        h('div', { className: 'vis' }, h(C.LivatarStack, { avatar: AV, users: TEAM.slice(0, 7).map((id, i) => ({ id, name: id, status: ['online','busy','away','offline'][i % 4] })), max: 7, size: 44 }))),
      h('article', { className: 'tile w3' }, h('h3', null, 'Integrations'), h('p', null, 'GitHub, Linear, Slack, Figma. Orbit fills in the boring parts.'),
        h('div', { className: 'vis' }, ['server','database','cloud','terminal','plug','chip'].map((k) => h(L, { key: k, variant: tech, seed: 'int-' + k, options: { kind: k }, size: 44 })))),
