function Av({ id, size = 40, bg }) {
  const p = PEOPLE[id]
  return h('span', { className: 'av', style: { width: size, height: size } },
    h(Livatar, { colors: PAL, variant: p.style, seed: id, size, options: p.options, alive: { idle: false, sleepAfter: 0 } }),

}
const rich = (t) => t.split(/(@\w+)/g).map((s, i) => /^@\w+$/.test(s) ? h('span', { key: i, className: 'mention' }, s) : s)

    first ? h(Av, { id: m.from, size: 40 }) : h('span', { className: 'gut' }, fmt(m.ts)),
    h('div', { className: 'body' },
      first && h('div', { className: 'who' }, p.name.replace(' (you)', ''), h('time', { dateTime: new Date(m.ts).toISOString() }, fmt(m.ts)), p.role === 'AI assistant' && h('span', { className: 'chip', style: { marginLeft: 8, padding: '0 7px', fontSize: 11 } }, 'AI')),

        showThread && m.replies && m.replies.length > 0 && h('button', { className: 'chip link', type: 'button', onClick: () => onThread(m.id) }, `${m.replies.length} ${m.replies.length === 1 ? 'reply' : 'replies'} · View thread`))),

}

function Composer({ placeholder, onSend, onAttach, disabled, members, label }) {
  const [text, setText] = useState('')
  const [emo, setEmo] = useState(false)
  const [sel, setSel] = useState(0)
  const ta = useRef(null)
  const mm = /(?:^|\s)@(\w*)$/.exec(text)
  const opts = mm ? members.filter((id) => PEOPLE[id].name.toLowerCase().startsWith(mm[1].toLowerCase())) : []
  const insert = (s) => { setText((t) => t + s); ta.current?.focus() }
  const pickMention = (id) => { setText(text.replace(/@\w*$/, '@' + PEOPLE[id].name.split(' ')[0] + ' ')); ta.current?.focus() }
  const send = () => { if (!text.trim() || disabled) return; onSend(text.trim()); setText(''); setEmo(false) }
  useEffect(() => { const e = ta.current; if (e) { e.style.height = 'auto'; e.style.height = Math.min(e.scrollHeight, 160) + 'px' } }, [text])
  useEffect(() => setSel(0), [mm && mm[1]])
  const keydown = (e) => {
    if (opts.length) {
      if (e.key === 'ArrowDown') { e.preventDefault(); setSel((sel + 1) % opts.length); return }
      if (e.key === 'ArrowUp') { e.preventDefault(); setSel((sel - 1 + opts.length) % opts.length); return }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickMention(opts[sel]); return }
    }
    if (e.key === 'Escape') setEmo(false)
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send() }
  }
  return h('div', { className: 'composer' },
    opts.length > 0 && h('div', { className: 'pop mention-list', role: 'listbox', 'aria-label': 'Mention a teammate' },
      opts.map((id, i) => h('button', { key: id, type: 'button', role: 'option', className: 'opt', 'aria-selected': i === sel, onMouseDown: (e) => { e.preventDefault(); pickMention(id) } }, h(Av, { id, size: 28 }), h('span', null, h('b', null, PEOPLE[id].name), h('small', { style: { display: 'block', color: 'var(--mute)' } }, PEOPLE[id].role))))),
    emo && h('div', { className: 'pop emojis', role: 'group', 'aria-label': 'Emoji' }, EMOJI.map((e) => h('button', { key: e, type: 'button', 'aria-label': e, onClick: () => insert(e) }, e))),
    h('div', { className: 'box' },
      h('textarea', { ref: ta, rows: 1, value: text, enterKeyHint: 'send', autoCapitalize: 'sentences', inputMode: 'text', autoComplete: 'off', placeholder, 'aria-label': label || 'Message', onChange: (e) => setText(e.target.value), onKeyDown: keydown }),
      h('div', { className: 'bar' },
        onAttach && h('button', { className: 'icon-btn', type: 'button', 'aria-label': 'Attach files', onClick: onAttach }, '📎'),
        h('button', { className: 'icon-btn', type: 'button', 'aria-label': 'Insert emoji', 'aria-expanded': emo, onClick: () => setEmo(!emo) }, '😊'),
        h('button', { className: 'icon-btn', type: 'button', 'aria-label': 'Mention someone', onClick: () => { insert(text && !/\s$/.test(text) ? ' @' : '@') } }, '@'),
        h('span', { className: 'sp' }),
        h('button', { className: 'send', type: 'button', disabled: !text.trim() || disabled, onClick: send }, 'Send'))))
}

function Dialog({ title, onClose, children }) {
  const ref = useRef(null)
  useEffect(() => { const prev = document.activeElement; ref.current?.focus(); return () => prev?.focus?.() }, [])
  return h('div', { className: 'scrim', onMouseDown: (e) => e.target === e.currentTarget && onClose() },
    h('div', { className: 'dlg', role: 'dialog', 'aria-modal': true, 'aria-label': title, tabIndex: -1, ref, onKeyDown: (e) => e.key === 'Escape' && onClose() },
      h('div', { style: { display: 'flex', alignItems: 'center' } }, h('h3', { style: { flex: 1 } }, title), h('button', { className: 'icon-btn', type: 'button', 'aria-label': 'Close', onClick: onClose }, '✕')),
      children))
}

function App() {
  const [store, setStore] = useState(seed)
  const [cur, setCur] = useState('general')
  const [unread, setUnread] = useState({ design: 2, engineering: 1, 'dm-ada': 1, random: 0 })
  const [typing, setTyping] = useState({})
  const [panel, setPanel] = useState(null)
  const [thread, setThread] = useState(null)
  const [nav, setNav] = useState(() => !matchMedia('(min-width:901px)').matches)
  const [dlg, setDlg] = useState(null)

  const [ai, setAi] = useState({ status: 'idle', text: '' })
  const [inCall, setInCall] = useState(false)
  const [muted, setMuted] = useState(false)
  const [speaker, setSpeaker] = useState(null)
  const [prefs, setPrefs] = useState({ notify: true, typing: true, motion: true })
  const [theme, setTheme] = useState('system')
  const [reaction, setReaction] = useState(null)
  const [selId, setSelId] = useState(null)
  const [lim, setLim] = useState(60)
  const [wide, setWide] = useState(() => matchMedia('(min-width:901px)').matches)
  useEffect(() => { const m = matchMedia('(min-width:901px)'); const f = () => setWide(m.matches); m.addEventListener('change', f); return () => m.removeEventListener('change', f) }, [])
  const curRef = useRef(cur); curRef.current = cur
  const prefRef = useRef(prefs); prefRef.current = prefs
  const feed = useRef(null)
  const chan = ALL.find((c) => c.id === cur)
  const msgs = store[cur] || []

  useEffect(() => { document.documentElement.dataset.theme = theme === 'system' ? '' : theme; if (theme === 'system') delete document.documentElement.dataset.theme }, [theme])
  useEffect(() => { document.documentElement.classList.toggle('no-motion', !prefs.motion) }, [prefs.motion])
  useEffect(() => { setUnread((u) => ({ ...u, [cur]: 0 })); setSelId(null); setLim(60) }, [cur])
  useEffect(() => {
    const vv = window.visualViewport
    const fit = () => { document.documentElement.style.setProperty('--vh', (vv ? vv.height : innerHeight) + 'px'); if (vv && vv.offsetTop) scrollTo(0, 0); const f = feed.current; if (f) f.scrollTop = f.scrollHeight }
    fit(); vv?.addEventListener('resize', fit); vv?.addEventListener('scroll', fit); addEventListener('orientationchange', fit)
    let sx = null, sy = 0
    const ts = (e) => { const t = e.touches[0]; sx = t.clientX < 28 ? t.clientX : null; sy = t.clientY }
    const te = (e) => { if (sx == null) return; const t = e.changedTouches[0]; const dx = t.clientX - sx; sx = null; if (dx > 70 && Math.abs(t.clientY - sy) < 60) back() }
    addEventListener('touchstart', ts, { passive: true }); addEventListener('touchend', te, { passive: true })
    return () => { vv?.removeEventListener('resize', fit); vv?.removeEventListener('scroll', fit); removeEventListener('orientationchange', fit); removeEventListener('touchstart', ts); removeEventListener('touchend', te) }
  }, [])
  useEffect(() => { const f = feed.current; if (f) f.scrollTop = f.scrollHeight }, [store, cur, typing, ai.text])
  useEffect(() => { document.body.classList.toggle('nav-open', nav); document.querySelector('.app')?.classList.toggle('nav-open', nav) }, [nav])
  useEffect(() => {
    const k = (e) => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); setDlg('cmd') } }
    addEventListener('keydown', k); return () => removeEventListener('keydown', k)
  }, [])
  useEffect(() => {
    if (!inCall) return
    const ids = ['ada', 'kai', 'mina']
    const t = setInterval(() => setSpeaker(pick(ids)), 1900)
    return () => clearInterval(t)
  }, [inCall])

  const toast = (t) => { const id = ++uid; setToasts((x) => [...x.slice(-2), { ...t, id }]) }
  const addMsg = (ch, m, parentId) => setStore((s) => ({
    ...s, [ch]: parentId ? s[ch].map((x) => x.id === parentId ? { ...x, replies: [...(x.replies || []), m] } : x) : [...(s[ch] || []), m],
  }))
  const arrive = (ch, m, parentId) => {
    addMsg(ch, m, parentId)
    if (ch !== curRef.current) {
      setUnread((u) => ({ ...u, [ch]: (u[ch] || 0) + 1 }))
      if (prefRef.current.notify) toast({ type: 'info', who: m.from, title: `${PEOPLE[m.from].name} in ${ALL.find((c) => c.id === ch).dm ? 'DM' : '#' + ch}`, description: m.text.slice(0, 70), ch })
    }
  }
  const simulate = async (ch, parentId, text) => {
    const c = ALL.find((x) => x.id === ch)
    const who = pick(c.members.filter((x) => x !== ME))
    await wait(900 + Math.random() * 900)
    setTyping((t) => ({ ...t, [ch]: who }))
    await wait(1800 + Math.random() * 1600)
    setTyping((t) => ({ ...t, [ch]: null }))
    let reply = pick(POOL[who])
    if (/thank/i.test(text)) reply = 'Anytime! 💛'
    else if (/\?\s*$/.test(text)) reply = pick(['Good question. I think yes, but let me double check.', 'Short answer: yes. Long answer: also yes.', 'Not sure yet, I will find out and report back.'])
    arrive(ch, { id: ++uid, from: who, ts: Date.now(), text: reply, rx: {} }, parentId)
  }
  const askAI = async (text) => {
    const lc = text.toLowerCase()
    const reply = AI_REPLIES[Object.keys(AI_REPLIES).find((k) => k !== 'default' && lc.includes(k)) || 'default']
    const mid = ++uid
    setAi({ status: 'submitted', text: '' })
    await wait(1100)
    addMsg('sage', { id: mid, from: 'sage', ts: Date.now(), text: '', streaming: true })
    setAi({ status: 'streaming', text: '' })
    let acc = ''
    for (const tok of reply.match(/\S+\s*/g)) {

      setStore((s) => ({ ...s, sage: s.sage.map((x) => x.id === mid ? { ...x, text: acc } : x) }))
      setAi({ status: 'streaming', text: acc })
      await wait(55)
    }
    setStore((s) => ({ ...s, sage: s.sage.map((x) => x.id === mid ? { ...x, streaming: false } : x) }))
    setAi({ status: 'ready', text: acc })
  }
  const send = (text, parentId) => {
    const m = { id: ++uid, from: ME, ts: Date.now(), text, rx: {} }
    addMsg(cur, m, parentId)
    if (chan.ai) askAI(text); else simulate(cur, parentId, text)

  const react = (ch, id, e, parentId) => setStore((s) => {
    const flip = (m) => { const u = (m.rx || {})[e] || []; return { ...m, rx: { ...m.rx, [e]: u.includes(ME) ? u.filter((x) => x !== ME) : [...u, ME] } } }
    return { ...s, [ch]: s[ch].map((m) => parentId ? (m.id === parentId ? { ...m, replies: m.replies.map((r) => r.id === id ? flip(r) : r) } : m) : (m.id === id ? flip(m) : m)) }
  })
  const backRef = useRef(null)
  const back = () => backRef.current && backRef.current()
  const go = (id, mid) => {
    setCur(id); setNav(false); setThread(null); if (panel === 'thread') setPanel(null)

  useEffect(() => {
    const t = setInterval(() => {
      const ch = pick(CHANNELS.filter((c) => c.id !== curRef.current)); const who = pick(ch.members)

    }, 28000)
    return () => clearInterval(t)

  const vis = msgs.slice(-lim)

    rows.push(h(Message, { key: m.id, m, first, sel: selId === m.id, onSel: () => setSelId(selId === m.id ? null : m.id), onReact: (id, e) => react(cur, id, e), onThread: (id) => { setSelId(null); setThread(id); setPanel('thread') } }))
  })
  const typer = typing[cur]
  const parent = thread && msgs.find((m) => m.id === thread)

    return h('button', { key: c.id, className: 'nav' + (n ? ' unread' : ''), type: 'button', 'aria-current': c.id === cur, onClick: () => go(c.id) },
      c.dm || c.ai ? (wide || nav ? h(Av, { id: c.dm || 'sage', size: 24, bg: true }) : h('span', { style: { width: 24, height: 24 } })) : h('span', { className: 'hash' }, '#'),
