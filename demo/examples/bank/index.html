<script type="importmap">{ "imports": { "react": "https://esm.sh/react@19.3.1", "react-dom/client": "https://esm.sh/react-dom@19.3.1/client?deps=react@19.3.1" } }</script>
<script type="module">
import { createElement as h, useState, useEffect, useMemo, useRef, Fragment } from 'react'
import { createRoot } from 'react-dom/client'
import * as C from '../../../dist/components.js'
import { Livatar } from '../../../dist/react.js'
import { money, food, vehicle, home, tech, music, animal, memoji, clay, anime, chibi, flat, human, ui, bot } from '../../../dist/index.js'

const PAL = ['#d9f0e5', '#c8e3d0', '#f3ecd6', '#eadfc2', '#f6e3a8']
const KEY = 'nest-bank-v1'
const STY = { food, transport: vehicle, home, tech, fun: music, income: money, transfer: money }
const CATS = { food: 'Food & drink', transport: 'Transport', home: 'Home', tech: 'Tech', fun: 'Fun' }
const still = { track: false, sleepAfter: 0, idle: false }
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches
const buzz = (p = 12) => { try { if (navigator.vibrate && !reduced()) navigator.vibrate(p) } catch {} }
const usd = (n, d = 2) => n.toLocaleString('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: d, maximumFractionDigits: d })
const dkey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
const ago = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return dkey(d) }
const dlabel = (k) => { const n = Math.round((new Date(dkey(new Date()) + 'T00:00') - new Date(k + 'T00:00')) / 864e5); return n === 0 ? 'Today' : n === 1 ? 'Yesterday' : new Date(k + 'T00:00').toLocaleDateString('en', { month: 'short', day: 'numeric' }) }

const CONTACTS = [
  { id: 'Maya Chen', name: 'Maya', role: 'Flatmate', avatar: { colors: PAL, variant: animal } },
  { id: 'Theo Okafor', name: 'Theo', role: 'Brother', avatar: { colors: PAL, variant: memoji } },
  { id: 'Priya Rao', name: 'Priya', role: 'Design club', avatar: { colors: PAL, variant: clay } },
  { id: 'Jonas Weber', name: 'Jonas', role: 'Landlord', avatar: { colors: PAL, variant: anime } },
  { id: 'Lena Fox', name: 'Lena', role: 'Friend', avatar: { colors: PAL, variant: chibi } },
  { id: 'Omar Said', name: 'Omar', role: 'Work lunch', avatar: { colors: PAL, variant: flat } },
]
const MER = {
  'Bean & Bloom': { cat: 'food', kind: 'donut' }, 'Noodle Lab': { cat: 'food', kind: 'sushi' }, 'Green Crate': { cat: 'food', kind: 'avocado' },
  'Zip Rides': { cat: 'transport', kind: 'car' }, 'Metro Pass': { cat: 'transport', kind: 'train' },
  'Sunday Rent': { cat: 'home', kind: 'house' }, 'Lumen Energy': { cat: 'home', kind: 'lamp' },
  'Cloudbase': { cat: 'tech', kind: 'cloud' }, 'PixelPad': { cat: 'tech', kind: 'chip' },
  'Vinyl Club': { cat: 'fun', kind: 'vinyl' }, 'Showtix': { cat: 'fun', kind: 'mic' },
  'Acme Payroll': { cat: 'income', kind: 'bill' }, 'Kite Studio': { cat: 'income', kind: 'coin' },
}
const seedTx = () => [
  ['Acme Payroll', 3400, 26], ['Sunday Rent', -1150, 25], ['Lumen Energy', -64.2, 23], ['Cloudbase', -29, 21], ['Noodle Lab', -22.5, 19], ['Vinyl Club', -18, 17],
  ['Zip Rides', -14.8, 15], ['Bean & Bloom', -5.4, 13], ['Green Crate', -47.9, 11], ['Kite Studio', 420, 9], ['Metro Pass', -78, 8], ['PixelPad', -129, 6],
  ['Showtix', -64, 4], ['Bean & Bloom', -6.2, 2], ['Zip Rides', -19.4, 1], ['Noodle Lab', -17.9, 0],
].map(([name, amt, d], i) => ({ id: 's' + i, name, cat: MER[name].cat, amt, d: ago(d) }))
const fresh = () => ({ balance: 8244.12, tx: seedTx(), limits: { food: 400, transport: 200, home: 1300, tech: 250, fun: 150 },
  goals: [
    { id: 'g1', name: 'Lisbon trip', kind: 'piggy', target: 1800, saved: 640, due: 75 },
    { id: 'g2', name: 'New laptop', kind: 'gem', target: 2400, saved: 2250, due: 30 },
    { id: 'g3', name: 'Rainy-day fund', kind: 'wallet', target: 5000, saved: 1200, due: 240 }],
  frozen: { virtual: false, travel: false }, prefs: { tfa: true, bio: true, push: true, round: false } })
const load = () => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.tx) return { ...fresh(), ...s } } catch {} return fresh() }
const save = (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)) } catch {} }

function useCount(to, ms = 1100) {
  const [v, setV] = useState(reduced() ? to : 0); const from = useRef(0)
  useEffect(() => {
    if (reduced()) { setV(to); return }
    const a = from.current, t0 = performance.now(); let id
    const step = (t) => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3); const x = a + (to - a) * e; setV(x); from.current = x; if (p < 1) id = requestAnimationFrame(step) }
    id = requestAnimationFrame(step); return () => cancelAnimationFrame(id)
  }, [to])
  return v
}
const Merchant = ({ name, size = 30 }) => { const m = MER[name]; return h(Livatar, { colors: PAL, variant: STY[m.cat], seed: name, size, options: { kind: m.kind }, alive: still, title: name }) }
const TxRow = ({ t }) => {
  const person = CONTACTS.find((c) => c.id === t.p)
  return h('li', { className: 'tx', style: { listStyle: 'none' } },
    h('span', { className: 'mer' }, person ? h(Livatar, { seed: person.id, size: 38, alive: still, ...person.avatar }) : h(Merchant, { name: t.name, size: 36 })),
    h('div', null, h('div', { style: { fontWeight: 700 } }, t.name), h('div', { className: 'muted small' }, (person ? 'Transfer' : CATS[t.cat] || 'Income') + ' · ' + dlabel(t.d) + (t.note ? ' · ' + t.note : ''))),
    h('b', { className: 'num ' + (t.amt > 0 ? 'pos' : 'neg') }, (t.amt > 0 ? '+' : '−') + usd(Math.abs(t.amt))))
}
const spentBy = (tx) => { const o = {}; tx.filter((t) => t.amt < 0 && CATS[t.cat]).forEach((t) => { o[t.cat] = (o[t.cat] || 0) + -t.amt }); return o }
const Logo = () => h('div', { className: 'logo' }, h('svg', { viewBox: '0 0 32 32', 'aria-hidden': true }, h('rect', { width: 32, height: 32, rx: 10, fill: '#0c7a55' }), h('path', { d: 'M6 19c2-6 7-9 10-9s8 3 10 9c-3 4-6 5-10 5S9 23 6 19Z', fill: '#f4a21f' }), h('ellipse', { cx: 16, cy: 18, rx: 4, ry: 3, fill: '#fff6dc' })), 'Nest')

/* ---------- Login ---------- */
function Login({ onIn }) {
  const [step, setStep] = useState('creds'); const [pw, setPw] = useState(''); const [email, setEmail] = useState('')
  return h('div', { className: 'login' },
    h('aside', { className: 'hero', 'aria-hidden': 'true' },
      h('div', { className: 'logo', style: { color: '#fff' } }, 'Nest'),
      h('div', null, h('h1', null, 'Money that looks back at you.'), h('p', null, 'Budgets, goals and cards with a face you can trust. Your cash is safe; your piggy bank is smug.')),
      h('div', { className: 'faces' }, [money, bot, animal, memoji, food].map((s, i) => h(Livatar, { key: i, colors: PAL, variant: s, seed: 'nest' + i, size: 72, mood: 'happy' })))),
    h('main', { className: 'formwrap', style: { padding: '60px 24px 24px' } },
      h('div', { className: 'formbox' },
        h(Logo), step === 'creds'
          ? h(Fragment, null, h('div', null, h('h1', null, 'Welcome back'), h('p', { className: 'muted', style: { margin: '6px 0 0' } }, 'Demo mode: any email and password works.')),
            h(C.LivatarForm, { avatar: { colors: PAL, variant: money, seed: 'nest-login', size: 96 }, onSubmit: async () => { await new Promise((r) => setTimeout(r, 700)); if (pw.length < 4) return false; setStep('otp'); return true } },
              h('label', { className: 'sr', htmlFor: 'em' }, 'Email'),
