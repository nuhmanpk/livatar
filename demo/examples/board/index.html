<style>

[style*="rgb(127, 90, 240)"],[style*="#7f5af0"]{background:var(--accent)!important;color:var(--accent-ink)!important}

.detail textarea{width:100%;min-height:70px;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 10px;resize:vertical}

.detail select{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:6px 8px;width:100%}
.detail [role=dialog]{}

<script type="module">
import { createElement as h, useState, useEffect, useMemo, useRef, Fragment } from 'react'
import { createRoot } from 'react-dom/client'
import * as C from '../../../dist/components.js'
import { Livatar } from '../../../dist/react.js'
import { memoji, clay, human, toon, anime, chibi, bot } from '../../../dist/index.js'

/* ---------- data ---------- */
const PEOPLE = {
  ana:   { name: 'Ana Ruiz',    role: 'Product lead',   style: memoji, opts: { skin: '#e2a87e', hairColor: '#3b2a22' } },
  ben:   { name: 'Ben Okafor',  role: 'iOS engineer',   style: human, opts: { skin: 'tan', hairColor: 'brown', eyes: 'brown' } },
  chloe: { name: 'Chloe Wang',  role: 'Designer',       style: anime, opts: { skin: '#f6c9a4', hairColor: '#b8462e', shirt: '#2ec4b6', eyeColor: '#4a3426' } },
  dev:   { name: 'Dev Patel',   role: 'Backend',        style: toon, opts: { skin: '#c68658', hairColor: '#3b2a22', shirt: '#ff7a8a' } },
  eli:   { name: 'Eli Novak',   role: 'QA',             style: chibi, opts: { skin: '#f6c9a4', hairColor: '#6b4429', outfit: '#ffb347' } },
}
const IDS = Object.keys(PEOPLE)
const PAL = ['#ffd9cf', '#f3e3c3', '#ffe2b8', '#cdeedd', '#fff1b8']
const av = (id) => ({ seed: id, variant: PEOPLE[id].style, colors: PAL, options: PEOPLE[id].opts })
const Face = ({ id, size = 28, mood }) => h(Livatar, { ...av(id), size, mood, alive: false })
const COLS = [
  { id: 'backlog', name: 'Backlog', limit: 6 },
  { id: 'progress', name: 'In progress', limit: 4 },
  { id: 'review', name: 'In review', limit: 3 },
  { id: 'done', name: 'Done', limit: 8 },
]
const LABELS = { design: '#db2777', bug: '#dc2626', feature: '#0d9488', infra: '#d97706', research: '#2563eb' }
const PRI = { urgent: ['Urgent', '#dc2626'], high: ['High', '#ea580c'], med: ['Medium', '#ca8a04'], low: ['Low', '#64748b'] }
const PROJECTS = [{ id: 'lumen', name: 'Lumen Mobile', emoji: '◐' }, { id: 'atlas', name: 'Atlas API v3', emoji: '▲' }, { id: 'web', name: 'Website revamp', emoji: '■' }]

const COARSE = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`
const off = (n) => { const d = new Date(); d.setHours(12); d.setDate(d.getDate() + n); return iso(d) }
const parse = (s) => new Date(s + 'T12:00:00')
const days = (s) => Math.round((parse(s) - parse(off(0))) / 864e5)
const fmtDue = (s) => { const n = days(s); return n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n === -1 ? 'Yesterday' : parse(s).toLocaleDateString('en', { month: 'short', day: 'numeric' }) }
const uid = () => Math.random().toString(36).slice(2, 9)
const T = (id, title, col, pri, labels, who, due, start, pts, desc, subs = [], comments = []) => ({
  id, title, col, pri, labels, who, due: off(due), start: off(start), pts, desc,
  subs: subs.map((s, i) => ({ id: id + 's' + i, text: s[0], done: s[1] })),
  comments: comments.map((c, i) => ({ id: id + 'c' + i, who: c[0], text: c[1], t: c[2] })),
  log: [{ id: id + 'l0', who: who[0] || 'ana', text: 'created this task', t: 'Last week' }],
})
const seed = () => ({
  lumen: [
    T('t1', 'Onboarding flow: welcome carousel', 'done', 'med', ['design'], ['chloe'], -3, -9, 3, 'Three-step carousel with skip. Motion spec in Figma.', [['Illustrations', true], ['Motion spec', true]], [['ana', 'Love the bouncy easing.', '3d ago']]),
