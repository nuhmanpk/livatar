<script type="module">

const PAL = ['#fff1d6', '#fde2a8', '#fbd0b0', '#d6ebc8', '#f8d4cc']
const LV = (p) => h(Livatar, { colors: PAL, ...p })
const AV = { colors: PAL }
const S = { food, fruit, drink, plant }
const P = [
  { id: 'avo', name: 'Avocado Toast Loaf', cat: 'Bakery', v: 'food', kind: 'toast', price: 8.5, rate: 4.8, n: 212, tint: '#d9efc8', desc: 'Sourdough with smashed avocado swirl and chili flakes. Best the same day.' },

  { id: 'cup', name: 'Vanilla Bean Cupcake', cat: 'Bakery', v: 'food', kind: 'cupcake', price: 4.0, rate: 4.9, n: 128, tint: '#fde2c4', desc: 'Madagascan vanilla sponge with cream cheese frosting.' },
  { id: 'ice', name: 'Pistachio Gelato', cat: 'Sweet', v: 'food', kind: 'icecream', price: 6.0, rate: 4.7, n: 96, tint: '#d8f0e4', desc: 'Sicilian pistachios, slow churned. Pint size, ships frozen.' },

  { id: 'lem', name: 'Lemon Curd Jar', cat: 'Pantry', v: 'fruit', kind: 'lemon', price: 8.0, rate: 4.8, n: 143, tint: '#fff3b0', desc: 'Bright, buttery curd for tarts, toast, or spoons.' },

  { id: 'bas', name: 'Windowsill Herb Pot', cat: 'Kitchen', v: 'plant', kind: 'succulent', price: 15.0, rate: 4.5, n: 64, tint: '#d3ecd2', desc: 'Terracotta pot with basil seedlings, ready to snip.' },
  { id: 'mus', name: 'Mushroom Grow Box', cat: 'Kitchen', v: 'plant', kind: 'mushroom', price: 24.0, rate: 4.3, n: 38, tint: '#ecdcd0', desc: 'Harvest oyster mushrooms in ten days. No sunlight needed.' },
  { id: 'sun', name: 'Edible Sunflower Seeds', cat: 'Pantry', v: 'plant', kind: 'sunflower', price: 6.5, rate: 4.6, n: 52, tint: '#fff0b8', desc: 'Roasted, lightly salted, perfect on rye.' }
]
const CATS = ['All', 'Bakery', 'Sweet', 'Pantry', 'Drinks', 'Kitchen']
const CAT_ICON = { All: ['food', 'cupcake'], Bakery: ['food', 'toast'], Sweet: ['food', 'icecream'], Pantry: ['fruit', 'lemon'], Drinks: ['drink', 'coffee'], Kitchen: ['plant', 'sprout'] }
const FREE = 45
const money = (n) => '$' + n.toFixed(2)
const byId = Object.fromEntries(P.map((p) => [p.id, p]))
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches

const Pic = ({ p, size = 120 }) => h(LV, { variant: S[p.v], seed: p.id, size, mood: 'happy', options: { kind: p.kind } })
const Stars = ({ v }) => h('span', { className: 'stars', role: 'img', 'aria-label': v + ' out of 5' }, '★'.repeat(Math.round(v)) + '☆'.repeat(5 - Math.round(v)))

function useCart() {
  const [cart, set] = useState(() => { try { return JSON.parse(localStorage.getItem('crumb-cart')) || {} } catch { return {} } })
  useEffect(() => { try { localStorage.setItem('crumb-cart', JSON.stringify(cart)) } catch {} }, [cart])
  const setQty = (id, q) => set((c) => { const n = { ...c }; if (q <= 0) delete n[id]; else n[id] = Math.min(q, 20); return n })
  return [cart, setQty, () => set({})]
}

function useEsc(open, fn) {
  useEffect(() => {
    if (!open) return
    const k = (e) => e.key === 'Escape' && fn()
    addEventListener('keydown', k); return () => removeEventListener('keydown', k)
  }, [open, fn])
}

function Drawer({ open, onClose, cart, setQty, onCheckout }) {
  const ref = useRef(null)
  useEsc(open, onClose)
  useEffect(() => { if (open) ref.current?.focus() }, [open])
  if (!open) return null
  const lines = Object.entries(cart).map(([id, q]) => ({ p: byId[id], q })).filter((l) => l.p)
  const sub = lines.reduce((s, l) => s + l.p.price * l.q, 0)
  const left = Math.max(0, FREE - sub), ship = sub >= FREE || !sub ? 0 : 5.5
  return h(Fragment, null,
    h('div', { className: 'scrim', onClick: onClose }),
    h('aside', { className: 'drawer', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Shopping cart' },
      h('div', { className: 'dh' }, h('h2', { style: { fontSize: 24 } }, 'Your basket'), h('button', { ref, className: 'x', onClick: onClose, 'aria-label': 'Close cart' }, '✕')),
      h('div', { className: 'db' },
        !lines.length ? h(C.LivatarEmptyState, { colors: PAL, variant: animal, seed: 'basket', size: 110, title: 'Your basket is empty', description: 'Fresh bread is only a click away.', action: h('button', { className: 'btn', onClick: onClose }, 'Keep browsing') }) :
        h(Fragment, null,
          h('div', { 'aria-live': 'polite' }, left > 0 ? h('b', null, 'Add ' + money(left) + ' more for free shipping') : h('b', { style: { color: 'var(--ok)' } }, 'You unlocked free shipping!')),
          h('div', { className: 'bar2', role: 'progressbar', 'aria-valuenow': Math.min(100, Math.round(sub / FREE * 100)), 'aria-valuemin': 0, 'aria-valuemax': 100 }, h('i', { style: { width: Math.min(100, sub / FREE * 100) + '%' } })),
          lines.map(({ p, q }) => h('div', { className: 'ln', key: p.id },
            h('div', { style: { background: p.tint, borderRadius: 14, padding: 4 } }, h(Pic, { p, size: 56 })),
            h('div', { className: 't' }, h('b', null, p.name), h('span', { style: { color: 'var(--muted)', fontSize: 14 } }, money(p.price))),

function QuickView({ p, onClose, onAdd }) {

  if (!p) return null
  return h('div', { className: 'modal', onClick: (e) => e.target === e.currentTarget && onClose() },
    h('div', { className: 'qv', role: 'dialog', 'aria-modal': 'true', 'aria-label': p.name },
