<style>
:root{
  --bg:#e9f1d8; --phone:#fffdf6; --card:#ffffff; --ink:#26283a; --muted:#656a7c; --line:#e3e0d2;
  --g:#3a9a1a; --gd:#2a7311; --gl:#7ed957; --gsoft:#e6f7d6;
  --o:#ff9a3c; --od:#c2570a; --r:#e23d3d; --rd:#a82020; --b:#2f7be8;
  --okbg:#dbf6c2; --okfg:#1f5c0a; --badbg:#ffdede; --badfg:#9c1c1c;
  --shadow:0 10px 40px rgba(40,60,20,.18); --fh:'Lexend',system-ui,sans-serif; --fb:'Lexend',system-ui,sans-serif;
  --lv-accent:#2f8a12; --lv-line:#e3e0d2; --lv-surface:#f3f7e8; --lv-bg:#fffdf6; --lv-fg:#26283a; --lv-ring:#2f7be8;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1218; --phone:#181b24; --card:#222633; --ink:#f0f1f7; --muted:#a6abbd; --line:#323749;
  --g:#3fa51f; --gd:#2a7311; --lv-accent:#7ed957; --lv-line:#323749; --lv-surface:#222633; --lv-bg:#181b24; --lv-fg:#f0f1f7; --lv-ring:#7db4ff; --gsoft:#1f3318; --okbg:#1d3a14; --okfg:#c4f5a3; --badbg:#44201f; --badfg:#ffc4c4; --shadow:0 10px 40px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior:none}
button,a,input{touch-action:manipulation}
.phone{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);letter-spacing:-.01em;font:500 15px/1.4 var(--fb);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--b);outline-offset:2px;border-radius:10px}
.ex-back{position:fixed;top:calc(6px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));z-index:100;font:800 12px/1 var(--fb);padding:6px 10px;border-radius:99px;background:var(--card);color:var(--ink);text-decoration:none;border:1px solid var(--line);opacity:.85}
.ex-back::before{content:'';position:absolute;inset:-8px}
.ex-back:hover{opacity:1}
.wrap{display:grid;grid-template-columns:1fr;max-width:1000px;margin:0 auto;gap:28px;justify-content:center;padding-top:0}
.side{display:none}
.phone{position:relative;width:100%;max-width:480px;margin:0 auto;background:var(--phone);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:980px){
  .wrap{grid-template-columns:300px 480px;padding:28px 20px}
  .side{display:flex;flex-direction:column;gap:14px;position:sticky;top:28px;align-self:start}
  .phone{min-height:0;height:min(860px,calc(100dvh - 56px));min-height:0;border-radius:32px;box-shadow:var(--shadow);border:1px solid var(--line)}
}
h1,h2,h3{font-family:var(--fh);margin:0;line-height:1.1}
.brand{display:flex;align-items:center;gap:10px;font:800 28px var(--fh)}
.brand small{display:block;font:700 13px var(--fb);color:var(--muted)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.panel h3{font-size:18px;margin-bottom:8px}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gl),var(--g));border-radius:9px;transition:width .5s}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;gap:8px}
@media (max-width:979px){body{padding-top:calc(38px + env(safe-area-inset-top))}.phone{height:calc(100dvh - 38px - env(safe-area-inset-top))}}
@media (min-width:980px){.top{padding-top:14px}}
.chip{display:inline-flex;align-items:center;gap:6px;font:800 17px var(--fh);padding:4px 8px;border-radius:12px;background:none;border:0}
.chip svg{width:22px;height:22px}
.chip.fl{color:var(--od)} .chip.gm{color:var(--b)} .chip.hr{color:var(--r)}
@media (prefers-color-scheme:dark){.chip.fl{color:#ffb066}.chip.gm{color:#7db4ff}.chip.hr{color:#ff7d7d}}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px 96px}
/* bottom nav */
.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--line);background:var(--phone);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{min-height:56px;background:none;border:2px solid transparent;border-radius:14px;padding:4px 0 2px;display:grid;justify-items:center;gap:0;font:800 12px var(--fb);color:var(--muted)}
.nav button[aria-current=page]{background:var(--gsoft);border-color:var(--gl);color:var(--ink)}
.nav span.ic{line-height:0}
/* buttons */
.btn{min-height:50px;display:inline-flex;justify-content:center;align-items:center;gap:8px;border:0;border-radius:16px;padding:13px 22px;font:800 17px var(--fh);letter-spacing:.3px;text-transform:uppercase;background:var(--g);color:#fff;box-shadow:0 4px 0 var(--gd);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--gd)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 4px 0 var(--line);cursor:not-allowed;opacity:.9}
.btn.ghost{background:var(--card);color:var(--b);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.bad{background:var(--r);box-shadow:0 4px 0 var(--rd)}
.btn.full{width:100%}
.btn.sm{min-height:44px;padding:8px 16px;font-size:14px;border-radius:12px}
/* home */
.hero{display:flex;align-items:flex-end;gap:4px;margin-bottom:12px}
.goal{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px 10px;margin-bottom:16px}
.goal b{font:800 16px var(--fh)}
.unit{border-radius:18px;padding:14px 16px;color:#fff;margin:18px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.unit h2{font-size:clamp(18px,5.6vw,22px)}.unit p{margin:2px 0 0;font-size:14px;opacity:.95}
.path{display:flex;flex-direction:column;align-items:center;gap:20px;position:relative;padding:4px 0 8px}
.node{position:relative;width:78px;height:78px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;background:var(--gl);box-shadow:0 7px 0 var(--gd);transition:transform .1s,box-shadow .1s}
.node:active:not([data-s=locked]){transform:translateY(5px);box-shadow:0 2px 0 var(--gd)}
.node[data-s=done]{background:#ffc83d;box-shadow:0 7px 0 #c99410}
.node[data-s=locked]{background:var(--line);box-shadow:0 7px 0 rgba(0,0,0,.14);cursor:not-allowed}
.node[data-s=locked] .ni{filter:grayscale(1);opacity:.45}
.node .ni{line-height:0;background:var(--phone);border-radius:50%;padding:6px}
.node .tick{position:absolute;right:-4px;top:-4px;width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:14px;border:3px solid var(--phone)}
.node .lock{position:absolute;right:-4px;bottom:-2px;font-size:16px}
.node[data-s=current]{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.start{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--g);border:2px solid var(--line);border-radius:12px;padding:3px 10px;font:800 13px var(--fh);white-space:nowrap;animation:bob 1.2s ease-in-out infinite}
.start::after{content:'';position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.nlabel{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);font:800 13px var(--fb);color:var(--muted);white-space:nowrap;pointer-events:none}
.nlabel.l{left:auto;right:calc(100% + 10px)}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:30;background:var(--ink);color:var(--phone);border-radius:14px;padding:10px 14px;font-weight:800;text-align:center;animation:rise .25s}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
/* lesson */
.lesson{position:absolute;inset:0;z-index:20;background:var(--phone);display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:12px;padding:10px 16px 10px}

.x{background:none;border:0;font-size:26px;color:var(--muted);width:48px;height:48px;border-radius:12px;line-height:1}
.lbar{flex:1;height:16px;border-radius:10px;background:var(--line);overflow:hidden;position:relative}
.lbar i{display:block;height:100%;background:var(--gl);border-radius:10px;transition:width .4s;position:relative}
.lbar i::after{content:'';position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.4)}
.lbody{flex:1;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:16px}
.lbody h2{font-size:clamp(20px,6vw,24px)}
.lbody{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
input[type=range]{min-height:44px;font-size:16px}
.phone [role=grid]{gap:0!important}.phone [role=gridcell]{min-width:44px}
.phone [aria-label$=' month']{min-width:44px;min-height:44px}
.slots{align-content:flex-start}
.say{display:flex;align-items:center;gap:8px}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:10px 14px;font:800 clamp(17px,5.4vw,21px) var(--fh);background:var(--card)}
.bubble::before{content:'';position:absolute;left:-8px;top:50%;width:12px;height:12px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.opts{display:grid;gap:10px}
.opt{min-height:56px;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;font:800 18px var(--fb)}
.opt kbd{font:800 13px var(--fb);border:2px solid var(--line);border-radius:8px;min-width:26px;height:26px;display:grid;place-items:center;color:var(--muted)}
@media (hover:hover){.opt:hover:not(:disabled){background:var(--gsoft)}}
.opt[aria-pressed=true]{border-color:var(--b);background:rgba(47,123,232,.12)}
.opt.ok{border-color:var(--g);background:var(--okbg);color:var(--okfg)}
.opt.no{border-color:var(--r);background:var(--badbg);color:var(--badfg)}
.slots{min-height:104px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:repeating-linear-gradient(transparent 0 47px,var(--line) 47px 49px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:104px;align-content:flex-start}
.tile{min-width:48px;min-height:48px;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--card);padding:8px 14px;font:800 18px var(--fb);height:48px}
.tile.ghost{visibility:hidden}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:10px;align-content:start}
.pairs .opt{justify-content:center;text-align:center;min-height:54px}
.pairs .opt.done{opacity:.35;border-color:var(--line);background:none}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sheet{padding:16px 20px calc(18px + env(safe-area-inset-bottom));border-top:2px solid var(--line);display:flex;flex-direction:column;gap:12px}
.sheet.right{background:var(--okbg);color:var(--okfg);border-color:transparent}
.sheet.wrong{background:var(--badbg);color:var(--badfg);border-color:transparent}
.sheet .fb{display:flex;gap:12px;align-items:center}
.sheet .fb h3{font-size:22px}.sheet .fb p{margin:2px 0 0;font-weight:700}
.sheet.right .btn{background:var(--g)}
.sheet.wrong .btn{background:var(--r);box-shadow:0 4px 0 var(--rd)}
/* results */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:36px 20px 20px;flex:1}
.tiles{display:flex;gap:10px;width:100%;justify-content:center}
.rt{flex:1;max-width:130px;border-radius:14px;border:2px solid;overflow:hidden;font-family:var(--fh)}
.rt b{display:block;font-size:12px;padding:3px;color:#fff;text-transform:uppercase;letter-spacing:.5px}
.rt span{display:block;padding:10px 4px;font:800 22px var(--fh);background:var(--card)}
/* league */
.lg li{position:relative}
.lg li:nth-child(5){margin-bottom:26px}
.lg li:nth-child(5)::after{content:'▲ Promotion zone above';position:absolute;left:0;right:0;bottom:-24px;border-top:3px dashed var(--g);padding-top:3px;text-align:center;font:800 12px var(--fb);color:var(--g)}
.lg li:nth-child(n+9){color:var(--r)}
.lg li:nth-child(8){margin-bottom:26px}
.lg li:nth-child(8)::after{content:'▼ Demotion zone below';position:absolute;left:0;right:0;bottom:-24px;border-top:3px dashed var(--r);padding-top:3px;text-align:center;font:800 12px var(--fb);color:var(--r)}
.lg li.me{background:var(--gsoft);border-radius:12px;padding:2px 6px;margin-left:-6px;margin-right:-6px}
/* shop + profile */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.skin{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;display:grid;justify-items:center;gap:6px;text-align:center}
.skin.on{border-color:var(--g);background:var(--gsoft)}
.skin b{font:800 17px var(--fh)}
.price{font:800 14px var(--fh);color:var(--b);display:inline-flex;align-items:center;gap:4px}
.price svg{width:16px;height:16px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{display:grid;justify-items:center;gap:4px;text-align:center;font:800 11px/1.2 var(--fb);color:var(--muted)}
.badge .bi{border-radius:50%;background:var(--card);border:3px solid var(--line);padding:6px;line-height:0}
.badge.on .bi{border-color:#ffc83d;box-shadow:0 0 0 3px rgba(255,200,61,.3)}
.badge.on{color:var(--ink)}
.badge:not(.on) .bi>*{filter:grayscale(1);opacity:.4}
.sec{font:800 20px var(--fh);margin:18px 0 10px}
.profile-top{display:flex;align-items:center;gap:14px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mini div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.mini b{display:block;font:800 22px var(--fh)}.mini small{color:var(--muted);font-weight:800}
.fade-in{animation:rise .3s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-height:500px){
  .lhead{padding-top:4px;padding-bottom:4px}.top{padding-top:4px}
  .lbody{padding-top:4px;gap:10px}.lbody h2{font-size:18px}.say :is(span,svg){max-height:56px}
  .sheet{flex-direction:row;align-items:center;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
  .sheet .fb{flex:1}.sheet .btn{width:auto;min-width:200px;flex:none}.center{padding-top:12px}
}
@media (max-width:380px){.opt{padding:10px;font-size:16px}.badges{grid-template-columns:repeat(3,1fr)}.btn{padding:12px 16px}}
[role=progressbar]>div{background:linear-gradient(90deg,#ffd84d,#7ed957)!important}
</style>

<script type="module">

const L = (id, unit, title, icon, vocab, sent) => ({ id, unit, title, icon, vocab, sent })

const SKINS = [
  { id: 'kiwi', name: 'Kiwi', style: fruit, options: { kind: 'kiwi' }, price: 0 },
